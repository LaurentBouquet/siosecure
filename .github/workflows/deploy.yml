# Nom du workflow qui apparaîtra dans l'onglet "Actions" de GitHub
name: Deploy Vite app to GitHub Pages

# Déclencheur : le workflow s'exécutera à chaque push sur la branche 'main'
on:
  push:
    branches: [ main ] # Changez 'main' par 'master' si c'est le nom de votre branche principale

# Permissions nécessaires pour le déploiement sur les Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Jobs à exécuter
jobs:
  # Job pour construire et déployer le site
  build:
    runs-on: ubuntu-latest # Utilise une machine virtuelle Ubuntu

    steps:
      # Étape 1 : Récupérer le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Configurer l'environnement Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Utilisez la version de Node.js de votre projet
          cache: 'npm' # Met en cache les dépendances npm pour accélérer les exécutions

      # Étape 3 : Installer les dépendances
      - name: Install dependencies
        run: npm ci # Plus rapide et plus fiable que 'npm install' pour les CI

      # Étape 4 : Construire le projet Vite
      - name: Build Vite app
        run: npm run build

      # Étape 5 : Configurer les Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Étape 6 : Uploader l'artefact (le dossier 'dist')
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Le dossier généré par Vite

  # Job pour le déploiement
  deploy:
    # S'exécute après le job 'build' et nécessite son succès
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Étape 7 : Déployer l'artefact sur GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
